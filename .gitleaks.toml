# پیکربندی gitleaks برای این مخزن.
#
# قواعد پیش‌فرض کامل نگه داشته می‌شوند؛ فقط چند مقدار ساختگی که در تست‌ها
# تکرار می‌شوند از حالت «کلید نشت‌کرده» خارج می‌شوند.
#
# ⚠️ عمداً **فایل‌ها** allowlist نشده‌اند، فقط همان رشته‌های مشخص. اگر روزی یک
# کلید واقعی داخل همان فایل تست بیفتد، باید همچنان گرفته شود. allowlist کردن
# کل مسیر تست، دقیقاً همان دری است که کلید واقعی از آن رد می‌شود.
#
# اسکن روی کل تاریخچه اجرا می‌شود، پس اصلاح فایل امروز کافی نیست: مقدار در
# کامیت‌های قدیمی می‌ماند و بازنویسی تاریخچه هم گزینه‌ی درستی نیست.

[extend]
useDefault = true

[allowlist]
description = "مقدارهای ساختگی تست، نه کلید واقعی"
regexes = [
  # کد دسترسی نمونه در frontend/tests/security.test.ts — آنتروپی‌اش بالاست
  # ولی یک رشته‌ی ثابت در تست است، نه راز.
  '''ostandari-1404''',
  # کلید نمونه‌ی قاصدک در frontend/tests/sms.test.ts
  '''test-api-key-0123456789''',
]

# اگر تست تازه‌ای به یک مقدار کلیدمانند نیاز داشت، یا مقدارش را کم‌آنتروپی
# بگذارید، یا آگاهانه همین‌جا اضافه‌اش کنید. افزودن به این فهرست باید یک تصمیم
# باشد، نه یک عادت.
