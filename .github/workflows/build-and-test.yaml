name: Lint and Build
permissions:
  contents: read
  pull-requests: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # اجرای دستی روی هر شاخه. بدون این، تا وقتی `main` ساخته نشود هیچ‌کدام از
  # این تست‌ها — از جمله ساخت ایمیج استقرار — حتی یک بار هم اجرا نمی‌شوند.
  workflow_dispatch:

jobs:
  frontend:
    name: فرانت‌اند (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # ⚠️ package.json ریشه با npm کار می‌کند و `packageManager` ندارد؛ این
      # اکشن هم ریشه را می‌خواند، نه working-directory جاب. بدون این ورودی
      # با «No pnpm version is specified» می‌شکند.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Ensure build succeeds
        run: pnpm build

  demo-app:
    name: اپ دمو (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-app
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: demo-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Ensure build succeeds
        run: npm run build

  agent:
    # پروژه محدوده‌ی >=3.11,<3.15 را اعلام می‌کند، پس CI باید واقعاً روی بیش از یک
    # نسخه اجرا شود؛ وگرنه آن محدوده یک ادعای بی‌پشتوانه است.
    name: ایجنت (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: agent
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q

  interop:
    # رمزنگاری کلیدها بین دو زبان انجام می‌شود: پنل ادمین (Node) رمز می‌کند و
    # ایجنت (پایتون) رمزگشایی. اگر قالب دو طرف از هم دور بیفتد، هیچ تستِ
    # تک‌زبانه‌ای آن را نمی‌گیرد و خرابی فقط سر اجرای واقعی معلوم می‌شود.
    name: سازگاری رمزنگاری دو زبان
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install agent dependencies
        working-directory: agent
        run: uv sync --locked

      - name: Node ⇄ Python round trip
        run: bash scripts/check-crypto-interop.sh

  migration:
    name: مهاجرت پایگاه داده
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # اجرای دوباره نباید خطا بدهد؛ روی سرور واقعی هر استقرار همین را صدا می‌زند.
      - name: Create the schema, twice
        run: |
          node db/migrate.mjs
          node db/migrate.mjs

  e2e:
    name: تست سرتاسری (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ⚠️ package.json ریشه با npm کار می‌کند و `packageManager` ندارد؛ این
      # اکشن هم ریشه را می‌خواند، نه working-directory جاب. بدون این ورودی
      # با «No pnpm version is specified» می‌شکند.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install demo app dependencies
        working-directory: demo-app
        run: npm ci --legacy-peer-deps

      # تست‌های پنل ادمین، فرانت‌اند را با بیلد پروداکشن بالا می‌آورند.
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  live:
    # تنها جایی که ایجنت، سرور LiveKit و مرورگر واقعاً با هم حرف می‌زنند.
    # دو باگ واقعی را همین لایه پیدا کرد: نرسیدن اعزام ایجنت به کارگر، و
    # بلوکه ماندن ۱۲۳ ثانیه‌ای وقتی کاربر وسط تأییدخواهی تب را می‌بندد.
    # هیچ کلید پولی لازم ندارد؛ لایه‌ی صوتی خودش را رد می‌کند.
    name: آزمون زنده (LiveKit واقعی)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ⚠️ package.json ریشه با npm کار می‌کند و `packageManager` ندارد؛ این
      # اکشن هم ریشه را می‌خواند، نه working-directory جاب. بدون این ورودی
      # با «No pnpm version is specified» می‌شکند.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install agent dependencies
        working-directory: agent
        run: uv sync --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # سرور از داکر می‌آید؛ scripts/livekit-dev.sh خودش پیدایش می‌کند.
      - name: Pull the LiveKit server image
        run: docker pull livekit/livekit-server:latest

      - name: Run live tests
        run: npx playwright test -c playwright.live.config.ts --project=rpc

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    # ایمیج استقرار در هر PR ساخته می‌شود.
    # دلیلش این نیست که ایمیج را جایی می‌فرستیم — نمی‌فرستیم. دلیلش این است
    # که Dockerfile هیچ تست دیگری ندارد و خرابی‌اش فقط وسط استقرار معلوم
    # می‌شود، یعنی بدترین لحظه‌ی ممکن.
    name: ساخت ایمیج استقرار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ⚠️ DOCKER_BUILDKIT=0 عمدی است: لیارا با بیلدر کلاسیک می‌سازد. اگر
      # اینجا با BuildKit بسازیم، ویژگی‌هایی که آنجا پشتیبانی نمی‌شوند از
      # چشم CI پنهان می‌مانند — دقیقاً همان چیزی که یک بار اتفاق افتاد و
      # استقرار را در گام ۹ شکست.
      - name: Build with the classic builder, like Liara
        env:
          DOCKER_BUILDKIT: 0
        run: docker build -t ostandari:ci .

      # ایمیج باید بتواند بالا بیاید و با نبود دیسک، خطای روشن بدهد — نه
      # اینکه بی‌صدا یک پایگاه داده‌ی موقت بسازد که با هر استقرار پاک می‌شود.
      - name: Refuse to start without a writable disk
        run: |
          output=$(docker run --rm -e DATABASE_PATH=/mnt/missing/ostandari.db ostandari:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "قابل نوشتن نیست" || {
            echo "::error::کانتینر باید نبود دیسک را با پیام روشن گزارش کند"
            exit 1
          }

  security:
    name: امنیت (audit و اسکن کلید)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # اسکن کلید به کل تاریخچه نیاز دارد

      # ⚠️ package.json ریشه با npm کار می‌کند و `packageManager` ندارد؛ این
      # اکشن هم ریشه را می‌خواند، نه working-directory جاب. بدون این ورودی
      # با «No pnpm version is specified» می‌شکند.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # سطح آستانه high است: موارد متوسط در وابستگی‌های ابزار توسعه بیلد را
      # نمی‌شکنند، ولی هر چیز شدید یا بحرانی باید جلوی merge را بگیرد.
      - name: Audit frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high

      - name: Audit demo app
        working-directory: demo-app
        run: npm ci --legacy-peer-deps && npm audit --audit-level=high

      - name: Scan history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
