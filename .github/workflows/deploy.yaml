name: Deploy to Liara

# ⚠️ بیلد روی خود لیارا برای این پروژه جواب نمی‌دهد و عمداً حذف شده است.
#
# اندازه‌گیری از لاگ واقعی: پس از ۱ دقیقه و ۴۱ ثانیه تازه `pnpm install` تمام
# شده بود — حدود ۲۰٪ کار. باقی‌مانده (بیلد Next، بیش از ۵۵۰ مگابایت وابستگی
# پایتون، و کپی حدود ۱٫۳ گیگابایت) بیلد را به ۷ تا ۱۰ دقیقه می‌رساند و از
# مهلت بیلد لیارا رد می‌شود. کش لیارا هم پایدار نماند: در تلاش دوم فقط دو گام
# اول کش شدند و `pnpm install` دوباره هر ۴۸۷ بسته را از صفر گرفت.
#
# پس ایمیج اینجا ساخته و به یک رجیستری فرستاده می‌شود و لیارا فقط آن را
# می‌کشد. کشیدن یک ایمیج، موازی و CDN-دار است؛ دانلود سریالی wheel و npm نیست.
#
# 🔴 دکمه‌ی «استقرار» در پنل لیارا را نزنید. آن دکمه سورس را آپلود می‌کند و
# ایمیج را روی خود لیارا می‌سازد — همان مسیری که بالا توضیح داده شد و در مهلت
# بیلد جا نمی‌شود. تنها راه درست همین ورکفلوست.
on:
  # ادغام در main یعنی استقرار. شاخه‌های کاری آزادند.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: نام اپ در لیارا (خالی یعنی از متغیر LIARA_APP خوانده شود)
        required: false
      registry:
        description: ایمیج کجا منتشر شود
        type: choice
        options: [ghcr, dockerhub]
        default: ghcr

permissions:
  contents: read
  packages: write

concurrency:
  # دو استقرار هم‌زمان روی یک اپ یعنی نتیجه‌ی غیرقابل‌پیش‌بینی
  group: liara-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: استقرار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # رویداد push هیچ ورودی‌ای ندارد، پس مقدارها از متغیرهای مخزن می‌آیند و
      # ورودی دستی فقط آن‌ها را موقتاً کنار می‌زند. اگر نام اپ هیچ‌جا نباشد،
      # همین‌جا با پیام روشن می‌ایستیم — نه با خطای مبهم لیارا چند گام بعد.
      - name: Work out where this is going
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          VAR_APP: ${{ vars.LIARA_APP }}
          VAR_REGISTRY: ${{ vars.LIARA_REGISTRY }}
        run: |
          APP="${INPUT_APP:-$VAR_APP}"
          REGISTRY="${INPUT_REGISTRY:-${VAR_REGISTRY:-ghcr}}"

          if [ -z "$APP" ]; then
            echo "::error::نام اپ لیارا معلوم نیست. یک بار در Settings → Secrets and variables → Actions → Variables متغیر LIARA_APP را بسازید."
            exit 1
          fi
          if [ "$REGISTRY" != "ghcr" ] && [ "$REGISTRY" != "dockerhub" ]; then
            echo "::error::رجیستری باید ghcr یا dockerhub باشد، نه '$REGISTRY'."
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "اپ: $APP — رجیستری: $REGISTRY"

      # پیش از بیلد، نه بعدش: نبودِ توکن نباید پس از ده دقیقه ساختن ایمیج
      # معلوم شود. ارزان‌ترین بررسی، اول.
      - name: Check the Liara token
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run: |
          if [ -z "$LIARA_TOKEN" ]; then
            echo "::error::LIARA_TOKEN تنظیم نشده است. آن را در Settings → Secrets and variables → Actions بگذارید."
            exit 1
          fi

      # DOCKER_BUILDKIT=0 چون لیارا بیلدر کلاسیک دارد. ایمیج باید با همان
      # بیلدری ساخته شود که آنجا هم ساخته می‌شد، وگرنه تفاوت‌ها پنهان می‌مانند.
      - name: Build the image
        env:
          DOCKER_BUILDKIT: 0
        run: docker build -t ostandari:ci .

      - name: Sign in to GHCR
        if: env.REGISTRY == 'ghcr'
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign in to Docker Hub
        if: env.REGISTRY == 'dockerhub'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME و DOCKERHUB_TOKEN را در Secrets بگذارید."
            exit 1
          fi
          echo "IMAGE=docker.io/$USERNAME/ostandari:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "$TOKEN" | docker login docker.io -u "$USERNAME" --password-stdin

      - name: Push
        run: |
          docker tag ostandari:ci "$IMAGE"
          docker push "$IMAGE"

      # لیارا ایمیج را **بدون اعتبارنامه** می‌کشد. اگر مخزن رجیستری خصوصی
      # باشد، استقرار با خطایی مبهم شکست می‌خورد.
      #
      # ⚠️ این گام عمداً **استقرار را متوقف نمی‌کند**. بررسی دسترسی ناشناس به
      # شبکه وابسته است و یک مثبت کاذب، استقرار سالم را می‌خواباند — که از
      # مشکلی که قرار بود بگیرد بدتر است. پس فقط هشدار می‌دهد و اگر لیارا
      # واقعاً نتوانست ایمیج را بکشد، راه‌حل همین‌جا در لاگ نوشته است.
      - name: Check that the image can be pulled anonymously
        continue-on-error: true
        run: |
          docker logout ghcr.io > /dev/null 2>&1 || true
          docker logout docker.io > /dev/null 2>&1 || true
          docker logout > /dev/null 2>&1 || true

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "✓ ایمیج به‌صورت عمومی قابل کشیدن است: $IMAGE"
            exit 0
          fi

          echo "::warning::دسترسی ناشناس به ایمیج تأیید نشد: $IMAGE"
          echo "استقرار ادامه می‌یابد. اگر لیارا نتوانست ایمیج را بکشد، علتش این است:"
          if [ "$REGISTRY" = "ghcr" ]; then
            cat <<'MESSAGE'

          بسته‌های GHCR بار اول خصوصی ساخته می‌شوند. یک بار این کار را بکنید:

            GitHub → صفحه‌ی مخزن → Packages → ostandari
              → Package settings → Change visibility → Public

          MESSAGE
          else
            cat <<'MESSAGE'

          مخزن داکرهاب را عمومی کنید:

            hub.docker.com → Repositories → ostandari → Settings → Make public

          MESSAGE
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run: |
          # بدون --detach: با استقرار خودکار، ورکفلوی سبز باید یعنی «سایت واقعاً
          # بالا آمد». وگرنه یک ریلیز شکست‌خورده، اجرا را سبز نشان می‌دهد —
          # همان کلاس خطایی که یک بار در این پروژه خوردیم (CI سبز، استقرار قرمز).
          npx --yes @liara/cli@latest deploy \
            --api-token "$LIARA_TOKEN" \
            --app "$APP" \
            --image "$IMAGE"
