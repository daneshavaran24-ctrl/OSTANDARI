name: Deploy to Liara

# اولین اجرا عمداً دستی است. استقرار خودکار با هر push تا وقتی روشن شود که
# اپ، دیسک و متغیرها در پنل لیارا آماده‌اند، بیشتر ضرر دارد تا سود.
on:
  workflow_dispatch:
    inputs:
      app:
        description: نام اپ در لیارا
        required: true
      build_location:
        description: بیلد کجا انجام شود
        type: choice
        options: [germany, iran]
        default: germany
      prebuilt:
        description: ایمیج را همین‌جا بساز و فقط همان را مستقر کن (بیلد لیارا اصلاً اجرا نمی‌شود)
        type: boolean
        default: false

permissions:
  contents: read
  # برای فرستادن ایمیج به GHCR در حالت prebuilt
  packages: write

concurrency:
  # دو استقرار هم‌زمان روی یک اپ یعنی نتیجه‌ی غیرقابل‌پیش‌بینی
  group: liara-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: استقرار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # همان ایمیجی که مستقر می‌شود، اول اینجا ساخته می‌شود. اگر Dockerfile
      # خراب باشد، اینجا معلوم می‌شود نه وسط استقرار.
      #
      # DOCKER_BUILDKIT=0 چون لیارا هم بیلدر کلاسیک دارد. با BuildKit این
      # گام سبز می‌شود و استقرار بعدش می‌شکند — که بی‌فایده‌ترین حالت است.
      - name: Build the image with the classic builder
        env:
          DOCKER_BUILDKIT: 0
        run: docker build -t ostandari:ci .

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the token
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run: |
          if [ -z "$LIARA_TOKEN" ]; then
            echo "::error::LIARA_TOKEN تنظیم نشده است. آن را در Settings → Secrets → Actions بگذارید."
            exit 1
          fi

      # --- مسیر ۱: ایمیج از پیش ساخته‌شده -----------------------------------
      #
      # بیلد لیارا مهلت زمانی دارد و این ایمیج بزرگ است. اینجا هیچ مهلتی نیست،
      # پس ایمیج ساخته و به GHCR فرستاده می‌شود و لیارا فقط آن را می‌کشد.
      #
      # ⚠️ بسته‌ی GHCR باید **عمومی** باشد، وگرنه لیارا نمی‌تواند بکشدش. بار
      # اول در GitHub → Packages → ostandari → Package settings آن را عمومی کنید.
      - name: Push the image to GHCR
        if: ${{ inputs.prebuilt }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ostandari:ci "$image"
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy the prebuilt image
        if: ${{ inputs.prebuilt }}
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run: |
          npx --yes @liara/cli@latest deploy \
            --api-token "$LIARA_TOKEN" \
            --app "${{ inputs.app }}" \
            --image "$IMAGE" \
            --detach

      # --- مسیر ۲: بیلد روی خود لیارا ---------------------------------------
      #
      # build-location پیش‌فرض «germany» است چون بخش بزرگ بیلد، دانلود از
      # PyPI و npm و داکرهاب است و از زیرساخت آلمان بسیار سریع‌تر انجام
      # می‌شود. اگر الزام دارید بیلد داخل ایران بماند، iran را انتخاب کنید و
      # احتمال برخورد با مهلت زمانی را بپذیرید.
      - name: Deploy
        if: ${{ !inputs.prebuilt }}
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run: |
          npx --yes @liara/cli@latest deploy \
            --api-token "$LIARA_TOKEN" \
            --app "${{ inputs.app }}" \
            --platform docker \
            --build-location "${{ inputs.build_location }}" \
            --detach
