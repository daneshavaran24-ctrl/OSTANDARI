[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "دستیار صوتی پشتیبانی فنی استانداری، ساخته‌شده با LiveKit Agents"
# کران بالای <3.15 از خودِ livekit-agents می‌آید و نباید حذف شود
requires-python = ">=3.11,<3.15"

dependencies = [
    "livekit-agents[bey,openai]~=1.8.1",
    "livekit-plugins-ai-coustics~=0.2",
    "livekit-plugins-noise-cancellation~=0.3.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # طول خط — قالب‌بندی را formatter انجام می‌دهد
    "RUF001", # کاراکترهای غیر ASCII در رشته‌ها (متن فارسی)
    "RUF002", # کاراکترهای غیر ASCII در docstring (متن فارسی)
    "RUF003", # کاراکترهای غیر ASCII در کامنت (متن فارسی)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
